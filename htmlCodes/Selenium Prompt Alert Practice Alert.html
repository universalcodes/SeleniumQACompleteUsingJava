<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Prompt Alert Practice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(620px, 92%);
            padding: 32px;
            border: 1px solid #dbe3ee;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(31, 41, 55, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status,
        #result {
            min-height: 24px;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #eef2ff;
        }

        #result {
            background: #ecfdf5;
            font-weight: 700;
        }
    </style>
</head>

<body>
<main>
    <h1>Selenium Prompt Alert Practice</h1>

    <p>
        Button click karne ke 3 seconds baad native JavaScript prompt open hoga.
    </p>

    <button id="showPromptButton" type="button">
        Show Delayed Prompt
    </button>

    <div id="status" role="status">Status: Prompt handled</div>
    <div id="result" data-action="cancelled">Result: User clicked Cancel</div>
</main>

<script>
    const promptButton = document.getElementById("showPromptButton");
    const statusElement = document.getElementById("status");
    const resultElement = document.getElementById("result");

    promptButton.addEventListener("click", function () {
        statusElement.textContent = "Status: Prompt will open after 3 seconds";
        resultElement.textContent = "Result: Waiting for user action";
        resultElement.dataset.action = "waiting";

        window.setTimeout(function () {
            const enteredText = window.prompt(
                "Apna Selenium test text enter karein:",
                ""
            );

            statusElement.textContent = "Status: Prompt handled";

            if (enteredText === null) {
                resultElement.textContent = "Result: User clicked Cancel";
                resultElement.dataset.action = "cancelled";
                return;
            }

            resultElement.textContent = "Result: Entered text: " + enteredText;
            resultElement.dataset.action = "accepted";
        }, 3000);
    });
</script>


</body></html>
