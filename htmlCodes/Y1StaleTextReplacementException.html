<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stale Element Replacement Practice</title>
</head>
<body>
<h1>Stale Element Practice</h1>

<div id="message">Original message</div>

<button id="replaceButton" onclick="replaceMessage()">
    Replace Message
</button>

<script>
    function replaceMessage() {
        const oldMessage = document.getElementById("message");
        const newMessage = document.createElement("div");

        newMessage.id = "message";
        newMessage.textContent = "Updated message";

        oldMessage.replaceWith(newMessage);
    }
</script>
</body>
</html>
