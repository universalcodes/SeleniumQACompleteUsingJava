<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Input Type Text Validation Demo</title>
    <style>
        body {
   font-family: 'Segoe UI', Tahoma, sans-serif;
   background: linear-gradient(135deg, #f0f4f8, #d9e4f5);
   margin: 0;
   padding: 20px;
 }

 h2 {
   text-align: center;
   color: #2c3e50;
   margin-bottom: 30px;
 }

 .input-section {
   margin-bottom: 25px;
 }

 label {
   display: block;
   margin-bottom: 8px;
   font-weight: 600;
   color: #34495e;
 }

 input[type="text"] {
   padding: 10px;
   width: 320px;
   border: 2px solid #3498db;
   border-radius: 6px;
   transition: all 0.3s ease;
 }

 input[type="text"]:focus {
   border-color: #2ecc71;
   box-shadow: 0 0 8px rgba(46, 204, 113, 0.6);
   outline: none;
 }

 input[disabled] {
   background-color: #f5f5f5;
   color: #999;
   border-color: #bdc3c7;
 }

 .hidden {
   display: none;
 }

 .hidden-enabled {
   visibility: hidden; /* hidden but enabled */
 }

 .hidden-disabled {
   visibility: hidden; /* hidden but disabled */
 }

    </style>
</head>
<body>

<h2>Input Type Text Validation Demo</h2>

<!-- 1. Locate the Input Type as Text -->
<div class="input-section">
    <label for="txtLocate">Locate Input</label>
    <input type="text" id="txtLocate" placeholder="Locate me">
</div>

<!-- 2. Enter the Text -->
<div class="input-section">
    <label for="txtEnter">Enter Text</label>
    <input type="text" id="txtEnter" placeholder="Enter text here">
</div>

<!-- 3. Clear The Text -->
<div class="input-section">
    <label for="txtClear">Clear Text</label>
    <input type="text" id="txtClear" value="Clear me">
</div>

<!-- 4. Displayed, Enabled -->
<div class="input-section">
    <label for="txtEnabled">Displayed & Enabled</label>
    <input type="text" id="txtEnabled" placeholder="I am enabled">
</div>

<!-- 5. Displayed, Disabled -->
<div class="input-section">
    <label for="txtDisabled">Displayed & Disabled</label>
    <input type="text" id="txtDisabled" placeholder="I am disabled" disabled>
</div>

<!-- 6. Hidden but Enabled -->
<div class="input-section hidden-enabled">
    <label for="txtHiddenEnabled">Hidden but Enabled</label>
    <input type="text" id="txtHiddenEnabled" placeholder="Hidden enabled">
</div>

<!-- 7. Hidden but Disabled -->
<div class="input-section hidden-disabled">
    <label for="txtHiddenDisabled">Hidden but Disabled</label>
    <input type="text" id="txtHiddenDisabled" placeholder="Hidden disabled" disabled>
</div>

<!-- 8. Enter through Keyboard -->
<div class="input-section">
    <label for="txtKeyboard">Keyboard Entry</label>
    <input type="text" id="txtKeyboard" placeholder="Type using keyboard">
</div>

<!-- 9. Copy-Paste Simulation -->
<div class="input-section">
    <label for="txtCopyPaste">Copy-Paste Demo</label>
    <input type="text" id="txtCopyPaste" value="Copy this text">
</div>

</body>
</html>
