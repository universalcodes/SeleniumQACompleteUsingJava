<!DOCTYPE html>
<html>
<head>
    <title>Extreme Complex XPath Axes Example</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { color: #333; text-align: center; }
        h2 { color: #555; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .section { background-color: #fff; padding: 15px; margin: 20px 0; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div id=" mainContainer ">
    <h1>Employee Directory</h1>

    <!-- Section 1 -->
    <div class=" section " id=" section1 ">
        <h2>Team A</h2>
        <ul>
            <li>
                <span class=" empName ">Rahul Sharma</span>
                <span class=" empRole ">Developer</span>
                <a href=" profileRahul.html ">View Profile</a>
            </li>
            <li>
                <span class=" empName ">Anita Verma</span>
                <span class=" empRole ">Tester</span>
                <a href=" profileAnita.html ">View Profile</a>
            </li>
        </ul>
    </div>

    <!-- Section 2 -->
    <div class=" section " id=" section2 ">
        <h2>Team B</h2>
        <table border=" 1 ">
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
            <tr>
                <td>Suresh Kumar</td>
                <td>Manager</td>
                <td><button id=" btnSuresh ">Assign Task</button></td>
            </tr>
            <tr>
                <td>Priya Singh</td>
                <td>Designer</td>
                <td><button id=" btnPriya ">Assign Task</button></td>
            </tr>
        </table>
    </div>

    <!-- Section 3 -->
    <div class=" section " id=" section3 ">
        <h2>Team C</h2>
        <p>Team C works on <b>AI Projects</b> and <i>Automation</i>.</p>
        <!-- Nested Table -->
        <table border=" 1 ">
            <tr>
                <td>
                    <div class=" nested ">
                        <span class=" empName ">Arjun Singh</span>
                        <span class=" empRole ">Intern</span>
                        <a href=" profileArjun.html ">View Profile</a>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
