<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selenium Alert Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>Selenium Alert Practice</h2>

<button
        id="allActionsAlertButton"
        onclick="showAlertsInSequence()">
    Show Alert with All Actions
</button>

<p id="result">Result will appear here.</p>

<script>
    function showAlertsInSequence() {

        document.getElementById("result").textContent =
            "Please wait for 5 seconds...";

        setTimeout(function () {

            /*
             * First alert:
             * Only OK button
             */
            alert(
                "First Alert: Click OK to open confirmation alert."
            );

            /*
             * Second alert:
             * OK and Cancel buttons
             *
             * Yeh first alert ke OK hone ke baad open hoga.
             */
            const userAction = confirm(
                "Second Alert: Do you want to continue?"
            );

            if (userAction) {
                document.getElementById("result").textContent =
                    "User clicked OK on confirmation alert";
            } else {
                document.getElementById("result").textContent =
                    "User clicked Cancel on confirmation alert";
            }

        }, 5000);
    }
</script>

</body>
</html>
